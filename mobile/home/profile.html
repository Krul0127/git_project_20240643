<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개 - ChoSungmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/navigation.css">
    <style>
        body { background-color: #111; color: #eee; min-height: 100vh; }

        .header { background-color: #1a1a1a; box-shadow: 0 0 6px #000; }
        .header_title { color: #fff; }
        .header_hambuger, .header_search { color: #fff; }
        .header_text_input { background-color: #2a2a2a; border-color: #444; color: #eee; }
        .header_text_input::placeholder { color: #888; }
        .header_input_button { background-color: #e67e22; border-color: #e67e22; color: #fff; font-weight: bold; cursor: pointer; }
        .header_input_button:hover { background-color: #cf6d17; }

        .nav_wrapper { background-color: #1a1a1a; border-right: 1px solid #2a2a2a; }
        .nav_wrapper li:hover { background-color: #252525; }
        .nav_icon, .nav_menu { color: #ccc; }
        .nav_menu:hover { color: #e67e22; }
        .nav_menu.active { color: #e67e22; font-weight: bold; }

        nav { transition: transform 0.3s ease; }
        nav.nav_hidden { transform: translateX(-100%); }

        /* 모달 배경 어둡게 */
        .modal-backdrop { background-color: #000; }
    
        /* 로그인 버튼 */
        .header_login_btn {
            height: 32px;
            padding: 0 14px;
            margin-right: 8px;
            background-color: #e67e22;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .header_login_btn:hover { background-color: #cf6d17; }
        .header_login_btn.logged { background-color: #2a2a2a; border: 1px solid #444; color: #aaa; }
    </style>
</head>

<body>

    <header class="header">
        <div class="header_wrap">
            <h1 class="header_start">
                <button class="header_hambuger" onclick="toggleNav()" aria-label="메뉴 열기">&#9776;</button>
                <span class="header_title" onclick="location.href='exam01.html'" style="cursor:pointer;">ChoSungmin</span>
            </h1>
            <div class="header_center">
                <form class="header_form" onsubmit="return false">
                    <input class="header_text_input" placeholder="검색하고 싶은 단어 입력">
                    <button class="header_input_button" type="submit">검색</button>
                </form>
            </div>
            <div class="header_end">
                <button class="header_login_btn" onclick="handleLoginClick()" id="loginBtn">로그인</button>
                <button class="header_search" aria-label="검색">&#128269;</button>
                <div class="header_profile"></div>
            </div>
        </div>
    </header>

    <nav id="sideNav">
        <ul class="nav_wrapper">
            <li>
                <button class="nav_icon">🍽️</button>
                <button class="nav_menu" onclick="location.href='exam01.html'">홈</button>
            </li>
            <li>
                <button class="nav_icon">🎠</button>
                <button class="nav_menu" onclick="location.href='csm_review.html'">CSM 리뷰</button>
            </li>
            <li>
                <button class="nav_icon">🖼️</button>
                <button class="nav_menu" onclick="location.href='gallery.html'">갤러리</button>
            </li>
            <li>
                <button class="nav_icon">💡</button>
                <button class="nav_menu" onclick="location.href='idea.html'">아이디어</button>
            </li>
            <li>
                <button class="nav_icon">👤</button>
                <!-- 현재 페이지: active -->
                <button class="nav_menu active" onclick="location.href='profile.html'">자기소개</button>
            </li>
        </ul>
    </nav>

    <div class="modal fade" id="profileModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content p-4" style="background-color: #1a1a1a; border: 1px solid #333;">

                <button type="button" class="btn-close btn-close-white ms-auto"
                    onclick="location.href='exam01.html'" aria-label="닫기"></button>

                <div class="row align-items-start g-4 mt-1">

                    <div class="col-12 col-md-auto text-center">
                        <img src="imgs/gundam.jpg" alt="프로필 사진" class="rounded-3 object-fit-cover"
                            style="width:160px; height:200px;">
                    </div>

                    <div class="col-12 col-md d-flex flex-column gap-3 text-center text-md-start align-items-center align-items-md-start">
                        <h2 class="fw-bold fs-3 mb-0" style="color: #fff;">조성민</h2>
                        <ul class="list-unstyled mb-0 d-flex flex-column gap-2 fs-6" style="color: #ccc;">
                            <li>📅 생년월일: 2000. 01. 27</li>
                            <li>📍 거주지: 경기도 수원시 장안구 수성로 157번길 60</li>
                            <li>🎓 학력: 장안대학교 재학</li>
                            <li>📧 이메일: whtjdals0434@email.com</li>
                            <li style="color:#999; line-height:1.7;">안녕하세요 컴퓨터 공학과 3학년 조성민입니다.<br>
                                보유 자격증: ITQ, 컴퓨터활용2급, 워드프로세서2급, 정보처리기능사, 통신선로기능사</li>
                        </ul>
                        <button class="btn btn-outline-light px-4" onclick="location.href='exam01.html'">← 돌아가기</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const modal = new bootstrap.Modal(document.getElementById('profileModal'));
        modal.show();

        function toggleNav() {
            document.getElementById('sideNav').classList.toggle('nav_hidden');
        }
    </script>

    <script>
        window.addEventListener("DOMContentLoaded", function() {
            const btn = document.getElementById("loginBtn");
            if (!btn) return;
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                btn.textContent = "로그아웃";
                btn.classList.add("logged");
            }
        });

        function handleLoginClick() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                sessionStorage.removeItem("isLoggedIn");
                sessionStorage.removeItem("userName");
                location.reload();
            } else {
                location.href = "login.html";
            }
        }
    </script>
</body>
</html>
