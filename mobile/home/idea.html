<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디어 - ChoSungmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/navigation.css">
    <style>
        body { background-color: #111; color: #eee; min-height: 100vh; }

        .header { background-color: #1a1a1a; box-shadow: 0 0 6px #000; }
        .header_title { color: #fff; cursor: pointer; }
        .header_hambuger, .header_search { color: #fff; }
        .header_text_input { background-color: #2a2a2a; border-color: #444; color: #eee; }
        .header_text_input::placeholder { color: #888; }
        .header_input_button { background-color: #e67e22; border-color: #e67e22; color: #fff; font-weight: bold; cursor: pointer; }
        .header_input_button:hover { background-color: #cf6d17; }

        .nav_wrapper { background-color: #1a1a1a; border-right: 1px solid #2a2a2a; }
        .nav_wrapper li:hover { background-color: #252525; }
        .nav_icon, .nav_menu { color: #ccc; }
        .nav_menu:hover { color: #e67e22; }
        .nav_menu.active { color: #e67e22; font-weight: bold; }
        nav { transition: transform 0.3s ease; }
        nav.nav_hidden { transform: translateX(-100%); }

        .idea_section { margin: 76px 32px 40px 232px; }
        .idea_section h1 { color: #fff; font-size: 1.4rem; margin-bottom: 20px; }

        .idea_form { display: flex; gap: 10px; margin-bottom: 24px; }
        .idea_input { flex: 1; background-color: #2a2a2a; border: 1px solid #444; color: #eee; border-radius: 8px; padding: 10px 14px; font-size: 0.9rem; }
        .idea_input::placeholder { color: #888; }
        .idea_input:focus { outline: none; border-color: #e67e22; }
        .idea_add_btn { background-color: #e67e22; border: none; border-radius: 8px; color: #fff; font-weight: bold; padding: 0 20px; cursor: pointer; }
        .idea_add_btn:hover { background-color: #cf6d17; }

        .idea_card { background-color: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px 18px; height: 100%; position: relative; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .idea_card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        .idea_card_icon { font-size: 1.3rem; margin-bottom: 8px; }
        .idea_card p { font-size: 0.9rem; color: #ddd; line-height: 1.6; margin-bottom: 0; padding-right: 20px; white-space: pre-wrap; word-break: break-word; }
        .idea_delete_btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #666; font-size: 1rem; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .idea_delete_btn:hover { color: #e74c3c; background-color: rgba(231,76,60,0.1); }

        .idea_empty { color: #666; font-size: 0.9rem; padding: 24px 0; text-align: center; display: none; }
        .idea_empty.show { display: block; }

        @media screen and (max-width: 800px) {
            .idea_section { margin-left: 88px; }
        }
        @media screen and (max-width: 400px) {
            .idea_section { margin-left: 16px; margin-right: 16px; }
            .idea_form { flex-direction: column; }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header_wrap">
            <h1 class="header_start">
                <button class="header_hambuger" onclick="toggleNav()" aria-label="메뉴 열기">&#9776;</button>
                <span class="header_title" onclick="location.href='index.html'">ChoSungmin</span>
            </h1>
            <div class="header_center">
                <form class="header_form" onsubmit="return false">
                    <input class="header_text_input" placeholder="검색하고 싶은 단어 입력">
                    <button class="header_input_button" type="submit">검색</button>
                </form>
            </div>
            <div class="header_end">
                <button class="header_search" aria-label="검색">&#128269;</button>
                <div class="header_profile"></div>
            </div>
        </div>
    </header>

    <nav id="sideNav">
        <ul class="nav_wrapper">
            <li>
                <button class="nav_icon">🍽️</button>
                <button class="nav_menu" onclick="location.href='index.html'">홈</button>
            </li>
            <li>
                <button class="nav_icon">🎠</button>
                <button class="nav_menu" onclick="location.href='csm_review.html'">CSM 리뷰</button>
            </li>
            <li>
                <button class="nav_icon">🖼️</button>
                <button class="nav_menu" onclick="location.href='gallery.html'">갤러리</button>
            </li>
            <li>
                <button class="nav_icon">💡</button>
                <button class="nav_menu active" onclick="location.href='idea.html'">아이디어</button>
            </li>
            <li>
                <button class="nav_icon">👤</button>
                <button class="nav_menu" onclick="location.href='profile.html'">자기소개</button>
            </li>
        </ul>
    </nav>

    <div class="idea_section">
        <h1>💡 생각난 아이디어</h1>

        <form class="idea_form" onsubmit="return false">
            <input class="idea_input" id="ideaInput" placeholder="생각난 아이디어를 적어보세요"
                maxlength="200" onkeydown="if(event.key==='Enter'){addIdea();}">
            <button class="idea_add_btn" type="button" onclick="addIdea()">추가</button>
        </form>

        <div class="row g-3" id="ideaGrid"></div>
        <p class="idea_empty" id="ideaEmpty">아직 등록된 아이디어가 없어요. 위 입력창에 적어보세요!</p>
    </div>

    <script>
        function toggleNav() {
            document.getElementById('sideNav').classList.toggle('nav_hidden');
        }

        const IDEA_STORAGE_KEY = 'csm_ideas';
        const DEFAULT_IDEAS = [
            '🗺️ 리뷰한 맛집을 지도 위에 표시해서 위치를 한눈에 볼 수 있게 하기',
            '⭐ 마음에 드는 맛집을 즐겨찾기에 저장하고 따로 모아보는 기능',
            '🏷️ 한식, 양식, 디저트 등 음식 종류별로 리뷰를 분류하는 기능',
            '💬 다른 사람들이 리뷰에 댓글을 남길 수 있는 기능',
            '📊 월별로 방문한 맛집 수, 평균 별점 등을 그래프로 보여주는 기능',
            '🌗 현재 다크 테마에 더해 밝은 테마도 선택할 수 있게 하기'
        ];

        function loadIdeas() {
            try {
                const raw = localStorage.getItem(IDEA_STORAGE_KEY);
                if (raw === null) {
                    const seeded = DEFAULT_IDEAS.map(text => ({ id: Date.now() + Math.random(), text }));
                    localStorage.setItem(IDEA_STORAGE_KEY, JSON.stringify(seeded));
                    return seeded;
                }
                return JSON.parse(raw);
            } catch (e) {
                return [];
            }
        }

        function saveIdeas(ideas) {
            try {
                localStorage.setItem(IDEA_STORAGE_KEY, JSON.stringify(ideas));
            } catch (e) { /* storage unavailable */ }
        }

        function renderIdeas() {
            const ideas = loadIdeas();
            const grid = document.getElementById('ideaGrid');
            const empty = document.getElementById('ideaEmpty');
            grid.innerHTML = '';

            if (ideas.length === 0) {
                empty.classList.add('show');
                return;
            }
            empty.classList.remove('show');

            ideas.forEach(idea => {
                const col = document.createElement('div');
                col.className = 'col-lg-4 col-md-6 col-12';
                col.innerHTML = `
                    <div class="idea_card">
                        <button class="idea_delete_btn" aria-label="삭제" onclick="deleteIdea(${idea.id})">✕</button>
                        <div class="idea_card_icon">💡</div>
                        <p></p>
                    </div>`;
                col.querySelector('p').textContent = idea.text;
                grid.appendChild(col);
            });
        }

        function addIdea() {
            const input = document.getElementById('ideaInput');
            const text = input.value.trim();
            if (text === '') return;

            const ideas = loadIdeas();
            ideas.unshift({ id: Date.now() + Math.random(), text });
            saveIdeas(ideas);

            input.value = '';
            renderIdeas();
        }

        function deleteIdea(id) {
            const ideas = loadIdeas().filter(idea => idea.id !== id);
            saveIdeas(ideas);
            renderIdeas();
        }

        renderIdeas();
    </script>

</body>
</html>
