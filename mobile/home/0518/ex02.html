<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-success bg-opacity-10">
    <section class="container">
        <div class="card p-4 m-5">
            <div class="card-body">
                <h1 class="card-title fs-4 fw-bold pb-4">
                    중간고사 프로젝트 점수
                </h1>
                <table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">프로젝트</th>
      <th scope="col">이름</th>
      <th scope="col">점수</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">1</th>
      <td>Mark</td>
      <td>Otto</td>
      <td>
        <div class="progress">
            <div class="progress-bar" style="width:100%">100점</div>
        </div>
      </td>
    </tr>
    <tr>
      <th scope="row">2</th>
      <td>Jacob</td>
      <td>Thornton</td>
      <td>
        <div class="progress">
            <div class="progress-bar" style="width:90%">90점</div>
        </div>
      </td>
    </tr>
    <tr>
      <th scope="row">3</th>
      <td>John</td>
      <td>Doe</td>
      <td>
        <div class="progress">
            <div class="progress-bar" style="width:80%">80점</div>
        </div>
      </td>
    </tr>
  </tbody>
</table>
            </div>
        </div>

        <div class="card p-4 m-5">
            <div class="card-body">
                <h1 class="card-title fs-4 fw-bold pb-4">
                    기말고사 프론트페이지 진행사항
                </h1>
                <table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th scope="col">#</th>
      <th scope="col">프로젝트</th>
      <th scope="col">팀리더</th>
      <th scope="col">진행상태</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">1</th>
      <td>Mark</td>
      <td>Otto</td>
      <td>
        <div class="badge bg-success">완료</div>
      </td>
    </tr>
    <tr>
      <th scope="row">2</th>
      <td>Jacob</td>
      <td>Thornton</td>
      <td>
         <div class="badge bg-warning">보류</div>
      </td>
    </tr>
    <tr>
      <th scope="row">3</th>
      <td>John</td>
      <td>Doe</td>
      <td>
        <div class="badge bg-info">진행중</div>
      </td>
    </tr>
  </tbody>
</table>
            </div>
        </div>
    </section>
    
</body>
</html>
