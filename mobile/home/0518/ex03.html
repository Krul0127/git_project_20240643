<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary bg-opacity-25">
    <section class="container text-center">
        <div class="mt-5 pt-5">
            <h1 class="fw-bold">문의하기</h1>
            <p class="text-muted">Lorem ipsum dolor sit amet, consectetur adipisicing.</p>
            
            <form action="" class="row g-3 justify-content-center text-start" style="max-width: 700px; margin: 0 auto;">
                
                <!--  이름 입력 -->
                <div class="col-md-6 col-xl-5">
                    <div class="form-floating">
                        <input type="text" class="form-control rounded-4" id="nameInput" placeholder="이름">
                        <label for="nameInput">이름</label>
                    </div>
                </div>
                
                <!-- 이메일 입력  -->
                <div class="col-md-6 col-xl-5">
                    <div class="form-floating">
                        <input type="email" class="form-control rounded-4" id="emailInput" placeholder="name@example.com">
                        <label for="emailInput">이메일</label>
                    </div>
                </div>
                
                <!-- 메모 입력  -->
                <div class="col-12 col-xl-10">
                    <div class="form-floating">
                        <textarea class="form-control rounded-4" placeholder="Leave a comment here" id="memoInput" style="height: 150px"></textarea>
                        <label for="memoInput">메세지</label>
                    </div>
                </div>

                <!-- 버튼 -->
                <div class="col-md-12 mt-5 col-xl-10">
                    <button class="btn btn-danger rounded-4">전송하기</button>
                </div>

            </form>
        </div>
    </section>
</body>
</html>
