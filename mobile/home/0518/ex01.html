<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<section class="container">
    <h1 class="fw-bold text-center my-5 py-5">고객설문 점수</h1>
    <div class="m-auto w-50">
        <h2 class="fw-bold fs-4 mb-1">삼성 노트북</h2>
        <p class="text-muted">Lorem ipsum dolor sit amet.</p>

        <p class="mt-4 mb-2">사용목적</p>
        <div class="progress">
            <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" style="width:85%">학습용 85%</div>
        </div>

        <p class="mt-4 mb-2">성능</p>
        <div class="progress">
            <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width:98%">성능 98%</div>
        </div>

        <p class="mt-4 mb-2">디자인</p>
        <div class="progress">
            <div class="progress-bar bg-warning progress-bar-striped progress-bar-animated" style="width:50%">디자인 50%</div>
        </div>

        <p class="mt-4 mb-2">가격</p>
        <div class="progress">
            <div class="progress-bar bg-info progress-bar-striped progress-bar-animated" style="width:40%">가격 40%</div>
        </div>
    </div>
</section>
</body>
</html>
