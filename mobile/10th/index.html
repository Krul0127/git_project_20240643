<!DOCTYPE html> <!-- HTML5 문서임을 선언 -->
<html lang="ko"> <!-- 문서 언어를 한국어로 지정 -->
<head> <!-- 문서 정보 영역 시작 -->
  <meta charset="UTF-8"> <!-- 한글이 깨지지 않도록 UTF-8 사용 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면 크기에 맞춤 -->
  <title>계산기</title> <!-- 브라우저 탭 제목 -->
  <link rel="stylesheet" href="css/style.css"> <!-- 스타일 파일 연결 -->
</head> <!-- 문서 정보 영역 끝 -->
<body> <!-- 화면 내용 시작 -->
  <div class="calculator"> <!-- 계산기 전체 틀 -->
    <div class="expression" id="expression"></div> <!-- 입력 중인 식(예: 3 +)을 보여주는 줄 -->
    <div class="display" id="display">0</div> <!-- 숫자와 결과를 보여주는 화면 -->
    <div class="buttons" id="buttons"> <!-- 버튼 묶음 시작 -->
      <button data-action="number" data-value="7">7</button> <!-- 숫자 7 버튼 -->
      <button data-action="number" data-value="8">8</button> <!-- 숫자 8 버튼 -->
      <button data-action="number" data-value="9">9</button> <!-- 숫자 9 버튼 -->
      <button data-action="operator" data-value="/" class="operator">÷</button> <!-- 나누기 버튼 -->
      <button data-action="number" data-value="4">4</button> <!-- 숫자 4 버튼 -->
      <button data-action="number" data-value="5">5</button> <!-- 숫자 5 버튼 -->
      <button data-action="number" data-value="6">6</button> <!-- 숫자 6 버튼 -->
      <button data-action="operator" data-value="*" class="operator">×</button> <!-- 곱하기 버튼 -->
      <button data-action="number" data-value="1">1</button> <!-- 숫자 1 버튼 -->
      <button data-action="number" data-value="2">2</button> <!-- 숫자 2 버튼 -->
      <button data-action="number" data-value="3">3</button> <!-- 숫자 3 버튼 -->
      <button data-action="operator" data-value="-" class="operator">−</button> <!-- 빼기 버튼 -->
      <button data-action="clear" class="clear">C</button> <!-- 전체 지우기 버튼 -->
      <button data-action="number" data-value="0">0</button> <!-- 숫자 0 버튼 -->
      <button data-action="equals" class="operator">=</button> <!-- 계산 결과 버튼 -->
      <button data-action="operator" data-value="+" class="operator">+</button> <!-- 더하기 버튼 -->
    </div> <!-- 버튼 묶음 끝 -->
  </div> <!-- 계산기 전체 틀 끝 -->
  <script src="js/script.js"></script> <!-- 동작 스크립트 연결 -->
</body> <!-- 화면 내용 끝 -->
</html> <!-- 문서 끝 -->
